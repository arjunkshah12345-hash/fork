<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__BAYER4 = [[0,8,2,10],[12,4,14,6],[3,11,1,9],[15,7,13,5]].map(function(r){return r.map(function(v){return (v+0.5)/16;});});
      window.__bayerURI = function(color, t){
        t = t == null ? 0.5 : t;
        var cells = "";
        for (var y=0;y<4;y++) for (var x=0;x<4;x++) if (window.__BAYER4[y][x] > t) cells += "<rect x='"+x+"' y='"+y+"' width='1' height='1' fill='"+color+"'/>";
        var svg = "<svg xmlns='http://www.w3.org/2000/svg' width='4' height='4' viewBox='0 0 4 4' shape-rendering='crispEdges'>"+cells+"</svg>";
        return "url(data:image/svg+xml;base64,"+btoa(svg)+")";
      };
      window.__bar = function(cv, state){
        var ctx = cv.getContext("2d");
        var W = cv.width, H = cv.height, CELL = 6, B = window.__BAYER4;
        ctx.clearRect(0,0,W,H);
        var w = Math.max(0, Math.round(W * (1 - 0.72 * state.p)));
        for (var y=0; y<H; y+=CELL) for (var x=0; x<w; x+=CELL){
          var lit = B[(y/CELL)&3][(x/CELL)&3] < 0.42;
          ctx.fillStyle = lit ? "rgba(240,70,70,0.96)" : "rgba(240,70,70,0.26)";
          ctx.fillRect(x,y,CELL,CELL);
        }
      };
    </script>
    <style>
      * { margin:0; padding:0; box-sizing:border-box; }
      html,body { width:1920px; height:1080px; overflow:hidden; background:#090a0c; }
      body { font-family:"Geist",system-ui,sans-serif; color:#e8e4dc; }
      .wash { position:absolute; inset:0; pointer-events:none; opacity:0.05; background-size:16px 16px; image-rendering:pixelated; }
      .mask { overflow:hidden; display:block; padding:0.08em 0; margin:-0.08em 0; }
      #stage { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; }
      .kicker { font-family:"Geist Mono",monospace; font-size:26px; font-weight:500; letter-spacing:0.22em; text-transform:uppercase; color:#667078; margin-bottom:44px; }
      #words { display:flex; }
      .w { font-size:148px; font-weight:700; letter-spacing:-0.045em; line-height:1.06; }
      .red { color:#f04646; }
      #row { display:flex; align-items:center; gap:36px; margin-top:64px; }
      #barwrap { width:880px; height:44px; overflow:hidden; }
      #bar { width:880px; height:44px; image-rendering:pixelated; transform-origin:left center; }
      #readout { font-family:"Geist Mono",monospace; font-size:34px; font-weight:500; color:#f5b3ae; width:140px; text-align:right; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="02-f2" data-start="0" data-duration="1.184" data-width="1920" data-height="1080" style="position:absolute; inset:0; overflow:hidden;">
      <div class="clip" data-start="0" data-duration="1.184" data-track-index="1"><div class="wash"></div></div>
      <div id="stage" class="clip" data-start="0" data-duration="1.184" data-track-index="2">
        <div class="kicker">The first answer</div>
        <div id="words">
          <div class="mask"><div class="w" id="w1">It&rsquo;s</div></div>
          <div class="mask"><div class="w red" id="w2">&nbsp;rarely&nbsp;</div></div>
          <div class="mask"><div class="w" id="w3">the</div></div>
          <div class="mask"><div class="w" id="w4">&nbsp;best.</div></div>
        </div>
        <div id="row">
          <div id="barwrap"><canvas id="bar" width="880" height="44"></canvas></div>
          <div id="readout">100%</div>
        </div>
      </div>
    </div>
    <script>
      document.querySelectorAll(".wash").forEach(function(el){ el.style.backgroundImage = window.__bayerURI("#aeb9c2", 0.5); });
      var state = { p: 0 };
      window.__bar(document.getElementById("bar"), state);
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused:true, defaults:{ ease:"power4.out" } });
      tl.fromTo("#w1", { yPercent:-112 }, { yPercent:0, duration:0.24 }, 0.02);
      tl.fromTo("#w2", { yPercent:-112 }, { yPercent:0, duration:0.24 }, 0.09);
      tl.fromTo("#w3", { yPercent:-112 }, { yPercent:0, duration:0.24 }, 0.16);
      tl.fromTo("#w4", { yPercent:-112 }, { yPercent:0, duration:0.24 }, 0.23);
      tl.fromTo("#barwrap", { scaleX:0 }, { scaleX:1, duration:0.12, ease:"power2.out" }, 0.42);
      var counter = { v: 100 };
      tl.to(state, { p:1, duration:0.52, ease:"power2.inOut", onUpdate:function(){ window.__bar(document.getElementById("bar"), state); } }, 0.5);
      tl.to(counter, { v:28, duration:0.52, ease:"power2.inOut", snap:1, onUpdate:function(){ document.getElementById("readout").textContent = Math.round(counter.v) + "%"; } }, 0.5);
      window.__timelines["02-f2"] = tl;
    </script>
  </body>
</html>
