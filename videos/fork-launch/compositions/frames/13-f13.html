<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__BAYER4 = [[0,8,2,10],[12,4,14,6],[3,11,1,9],[15,7,13,5]].map(function(r){return r.map(function(v){return (v+0.5)/16;});});
      window.__bayerURI = function(color, t){
        t = t == null ? 0.5 : t;
        var cells = "";
        for (var y=0;y<4;y++) for (var x=0;x<4;x++) if (window.__BAYER4[y][x] > t) cells += "<rect x='"+x+"' y='"+y+"' width='1' height='1' fill='"+color+"'/>";
        var svg = "<svg xmlns='http://www.w3.org/2000/svg' width='4' height='4' viewBox='0 0 4 4' shape-rendering='crispEdges'>"+cells+"</svg>";
        return "url(data:image/svg+xml;base64,"+btoa(svg)+")";
      };
      window.__mk = (function(){
        var B = window.__BAYER4, C = { blue:[53,143,243], purple:[150,110,255], orange:[255,150,50], ivory:[232,228,220] };
        var CELL = 7, SIZE = 400;
        var T = { blue:[[14,16],[24,16],[32,26],[36,32],[48,32]], purple:[[14,32],[48,32]], orange:[[14,48],[24,48],[32,38],[36,32]] };
        var SQ = { blue:[11,13], purple:[11,29], orange:[11,45] };
        function segPts(pts){ var o=[]; for(var i=0;i<pts.length-1;i++){ var x0=pts[i][0],y0=pts[i][1],x1=pts[i+1][0],y1=pts[i+1][1]; var n=Math.max(Math.abs(x1-x0),Math.abs(y1-y0)); for(var j=0;j<=n;j++){ o.push([Math.round(x0+(x1-x0)*j/n),Math.round(y0+(y1-y0)*j/n)]); } } return o; }
        var P = {}; for(var k in T) P[k] = segPts(T[k]);
        var cv = document.getElementById("cv"), bc = document.getElementById("bloom");
        var ctx = cv.getContext("2d"), bctx = bc.getContext("2d");
        function rgb(c,a){ return "rgba("+c[0]+","+c[1]+","+c[2]+","+a+")"; }
        function cell(x,y,color,density){ var lit=density>B[y&3][x&3]; var a=lit?0.3+density*0.7:(0.3+density*0.7)*0.28; ctx.fillStyle=rgb(color,a); ctx.fillRect(x*CELL,y*CELL,CELL,CELL); }
        function stroke(color,key,prog){ var pts=P[key], up=Math.floor(prog*(pts.length-1)); for(var i=0;i<=up;i++){ var gx=pts[i][0],gy=pts[i][1]; for(var dy=-1;dy<=1;dy++)for(var dx=-1;dx<=1;dx++){ var d=Math.abs(dx)+Math.abs(dy); cell(gx+dx,gy+dy,color,d===0?0.92:d===1?0.55:0.38); } } }
        function square(key,prog){ var s=SQ[key], cols=Math.max(1,Math.round(prog*6)); for(var x=s[0];x<s[0]+cols;x++)for(var y=s[1];y<s[1]+6;y++){ var lit=0.62>B[y&3][x&3]; ctx.fillStyle=rgb(C[key],lit?0.85:0.25); ctx.fillRect(x*CELL,y*CELL,CELL,CELL); } }
        function node(scale){ if(scale<=0.02)return; var h=3*scale,cx=49,cy=32; for(var x=Math.floor(cx-h);x<=Math.ceil(cx+h);x++)for(var y=Math.floor(cy-h);y<=Math.ceil(cy+h);y++){ ctx.fillStyle=rgb(C.ivory,0.96); ctx.fillRect(x*CELL,y*CELL,CELL,CELL); } }
        return { paint:function(s){ ctx.clearRect(0,0,SIZE,SIZE); stroke(C.blue,"blue",s.b1); stroke(C.purple,"purple",s.b2); stroke(C.orange,"orange",s.b3); square("blue",s.q1); square("purple",s.q2); square("orange",s.q3); node(s.n); bctx.clearRect(0,0,SIZE,SIZE); bctx.drawImage(cv,0,0); } };
      })();
    </script>
    <style>
      * { margin:0; padding:0; box-sizing:border-box; }
      html,body { width:1920px; height:1080px; overflow:hidden; background:#090a0c; }
      body { font-family:"Inter",system-ui,sans-serif; color:#ece9e2; }
      .wash { position:absolute; inset:0; pointer-events:none; opacity:0.05; background-size:16px 16px; image-rendering:pixelated; }
      #stage { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; }
      #wrap { position:relative; width:360px; height:360px; }
      canvas { position:absolute; inset:0; width:360px; height:360px; image-rendering:pixelated; }
      #bloom { mix-blend-mode:plus-lighter; filter:blur(6px) brightness(1.6) saturate(1.5); opacity:0.6; }
      #sub { font-size:40px; color:#aeb9c2; letter-spacing:-0.01em; margin-top:34px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="13-f13" data-start="0" data-duration="0.418" data-width="1920" data-height="1080" style="position:absolute; inset:0; overflow:hidden;">
      <div class="clip" data-start="0" data-duration="0.418" data-track-index="1"><div class="wash"></div></div>
      <div id="stage" class="clip" data-start="0" data-duration="0.418" data-track-index="2">
        <div id="wrap"><canvas id="cv" width="360" height="360"></canvas><canvas id="bloom" width="360" height="360"></canvas></div>
        <div id="sub">Speculative execution for coding agents.</div>
      </div>
    </div>
    <script>
      document.querySelectorAll(".wash").forEach(function(el){ el.style.backgroundImage = window.__bayerURI("#aeb9c2", 0.5); });
      var state = { b1:1, b2:1, b3:1, q1:1, q2:1, q3:1, n:0 };
      function repaint(){ window.__mk.paint(state); }
      repaint();
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused:true, defaults:{ ease:"power4.out" } });
      tl.to(state, { n:1, duration:0.18, ease:"power4.out", onUpdate:repaint }, 0.02);
      tl.to(state, { n:1.3, duration:0.1, ease:"power2.inOut", onUpdate:repaint }, 0.2);
      tl.to(state, { n:1, duration:0.1, ease:"power3.out", onUpdate:repaint }, 0.3);
      tl.fromTo("#sub", { opacity:0, y:14 }, { opacity:1, y:0, duration:0.18, ease:"power3.out" }, 0.22);
      window.__timelines["13-f13"] = tl;
    </script>
  </body>
</html>
