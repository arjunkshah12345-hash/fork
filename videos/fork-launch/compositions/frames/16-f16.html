<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__BAYER4 = [[0,8,2,10],[12,4,14,6],[3,11,1,9],[15,7,13,5]].map(function(r){return r.map(function(v){return (v+0.5)/16;});});
      window.__bayerURI = function(color, t){
        t = t == null ? 0.5 : t;
        var cells = "";
        for (var y=0;y<4;y++) for (var x=0;x<4;x++) if (window.__BAYER4[y][x] > t) cells += "<rect x='"+x+"' y='"+y+"' width='1' height='1' fill='"+color+"'/>";
        var svg = "<svg xmlns='http://www.w3.org/2000/svg' width='4' height='4' viewBox='0 0 4 4' shape-rendering='crispEdges'>"+cells+"</svg>";
        return "url(data:image/svg+xml;base64,"+btoa(svg)+")";
      };
      window.__dither = (function(){
        var B = window.__BAYER4;
        var P = { green:[40,210,110], blue:[53,143,243], purple:[150,110,255], orange:[255,150,50] };
        function rgb(c,a){ return "rgba("+c[0]+","+c[1]+","+c[2]+","+a+")"; }
        function paint(cv, bars, cols, rows){
          var ctx = cv.getContext("2d"); ctx.clearRect(0,0,cols,rows);
          var n = bars.length, gap = 8, bandW = Math.floor((cols - gap*(n+1))/n);
          for (var i=0;i<n;i++){
            var seed = P[bars[i].color];
            var c0 = gap + i*(bandW+gap), c1 = c0 + bandW;
            var h = Math.max(1, Math.round(bars[i].frac * bars[i].grow * (rows-2)));
            var top = rows-h, floor = rows;
            for (var x=c0;x<c1;x++){
              var depth = floor-top;
              for (var y=top;y<floor;y++){
                var density = (y-top)/depth;
                var lit = density > B[y&3][x&3];
                var k = 0.28 + density*0.72;
                var a = lit ? k : k*0.38;
                ctx.fillStyle = rgb(seed,a); ctx.fillRect(x,y,1,1);
              }
              ctx.fillStyle = rgb(seed,0.78); ctx.fillRect(x,top,1,1);
            }
          }
        }
        return { paint:paint };
      })();
    </script>
    <style>
      * { margin:0; padding:0; box-sizing:border-box; }
      html,body { width:1920px; height:1080px; overflow:hidden; background:#090a0c; }
      body { font-family:"Inter",system-ui,sans-serif; color:#ece9e2; }
      .wash { position:absolute; inset:0; pointer-events:none; opacity:0.05; background-size:16px 16px; image-rendering:pixelated; }
      .kicker { font-family:"JetBrains Mono",monospace; font-size:20px; letter-spacing:0.22em; color:#8a959e; text-transform:uppercase; }
      #stage { position:absolute; left:180px; right:180px; top:120px; }
      #bars { position:relative; height:480px; margin-top:40px; }
      canvas { position:absolute; inset:0; width:100%; height:100%; image-rendering:pixelated; }
      #bloom { position:absolute; inset:0; width:100%; height:100%; mix-blend-mode:plus-lighter; filter:blur(12px) brightness(1.7) saturate(1.4); opacity:0.55; }
      #metrics { display:grid; grid-template-columns:repeat(4,1fr); gap:20px; margin-top:40px; }
      .metric .num { font-family:"JetBrains Mono",monospace; font-size:96px; font-weight:500; color:#dedbd5; }
      .metric .num .unit { font-size:30px; color:#8a959e; margin-left:8px; }
      .metric .lab { font-family:"JetBrains Mono",monospace; font-size:19px; letter-spacing:0.18em; color:#8a959e; text-transform:uppercase; margin-top:10px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="16-f16" data-start="0" data-duration="0.98" data-width="1920" data-height="1080" style="position:absolute; inset:0; overflow:hidden;">
      <div class="clip" data-start="0" data-duration="0.98" data-track-index="1"><div class="wash"></div></div>
      <div id="stage" class="clip" data-start="0" data-duration="0.98" data-track-index="2">
        <div class="kicker">HOW FORK SCORES EACH BRANCH</div>
        <div id="bars">
          <canvas id="cv" width="320" height="96"></canvas>
          <canvas id="bloom" width="320" height="96"></canvas>
        </div>
        <div id="metrics">
          <div class="metric"><div class="num"><span class="val">0</span><span class="unit">%</span></div><div class="lab">Tests</div></div>
          <div class="metric"><div class="num"><span class="val">0</span><span class="unit">%</span></div><div class="lab">Review</div></div>
          <div class="metric"><div class="num"><span class="val">0</span><span class="unit">%</span></div><div class="lab">Simplicity</div></div>
          <div class="metric"><div class="num"><span class="val">0</span><span class="unit">%</span></div><div class="lab">Speed</div></div>
        </div>
      </div>
    </div>
    <script>
      document.querySelectorAll(".wash").forEach(function(el){ el.style.backgroundImage = window.__bayerURI("#aeb9c2", 0.5); });
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused:true, defaults:{ ease:"power4.out" } });
      tl.fromTo(".kicker", { y:12, opacity:0 }, { y:0, opacity:1, duration:0.16, ease:"power3.out" }, 0.0);
      const cv = document.getElementById("cv");
      const bc = document.getElementById("bloom");
      const bars = [
        { color:"green", frac:1.0, grow:0 },
        { color:"blue", frac:0.6, grow:0 },
        { color:"purple", frac:0.2, grow:0 },
        { color:"orange", frac:0.2, grow:0 }
      ];
      const vals = gsap.utils.toArray(".val");
      const targets = [50,30,10,10];
      function repaint(){ window.__dither.paint(cv, bars, 320, 96); var bctx = bc.getContext("2d"); bctx.clearRect(0,0,320,96); bctx.drawImage(cv,0,0); }
      repaint();
      bars.forEach(function(b, i){
        const t = 0.16 + i*0.12;
        tl.to(b, { grow:1, duration:0.36, ease:"power4.out", onUpdate:repaint }, t);
        const proxy = { v:0 };
        tl.to(proxy, { v:targets[i], duration:0.36, ease:"power2.out", onUpdate:function(){ vals[i].textContent = Math.round(proxy.v); } }, t);
      });
      window.__timelines["16-f16"] = tl;
    </script>
  </body>
</html>
