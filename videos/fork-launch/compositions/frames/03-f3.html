<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__BAYER4 = [[0,8,2,10],[12,4,14,6],[3,11,1,9],[15,7,13,5]].map(function(r){return r.map(function(v){return (v+0.5)/16;});});
      window.__bayerURI = function(color, t){
        t = t == null ? 0.5 : t;
        var cells = "";
        for (var y=0;y<4;y++) for (var x=0;x<4;x++) if (window.__BAYER4[y][x] > t) cells += "<rect x='"+x+"' y='"+y+"' width='1' height='1' fill='"+color+"'/>";
        var svg = "<svg xmlns='http://www.w3.org/2000/svg' width='4' height='4' viewBox='0 0 4 4' shape-rendering='crispEdges'>"+cells+"</svg>";
        return "url(data:image/svg+xml;base64,"+btoa(svg)+")";
      };
      window.__paintDot = function(ctx, x, y, r, col, a, B, CELL){
        for (var yy=0; yy<200; yy+=CELL) for (var xx=0; xx<640; xx+=CELL){
          var d = Math.sqrt((xx-x)*(xx-x)+(yy-y)*(yy-y));
          if (d > r) continue;
          var edge = 1 - d/r;
          var lit = B[(yy/CELL)&3][(xx/CELL)&3] < 0.3 + edge*0.55;
          var al = lit ? 0.95 : 0.18;
          ctx.fillStyle = "rgba("+col[0]+","+col[1]+","+col[2]+","+(al*a)+")";
          ctx.fillRect(xx,yy,CELL,CELL);
        }
      };
      window.__dots = function(cv, state){
        var ctx = cv.getContext("2d");
        var W = cv.width, H = cv.height, CELL = 4, B = window.__BAYER4;
        var C = { blue:[53,143,243], purple:[150,110,255], orange:[255,150,50], ivory:[232,228,220] };
        var yc = H/2, xs = [130, 320, 510], cc = W/2;
        ctx.clearRect(0,0,W,H);
        for (var i=0;i<3;i++){
          var x = xs[i] + (cc - xs[i]) * state.m;
          var a = Math.max(0, 1 - state.m * 1.35);
          if (a > 0.02) window.__paintDot(ctx, x, yc, 58, C[["blue","purple","orange"][i]], a, B, CELL);
        }
        if (state.m > 0.45) window.__paintDot(ctx, cc, yc, 62, C.ivory, Math.min(1, (state.m-0.45)/0.4), B, CELL);
      };
    </script>
    <style>
      * { margin:0; padding:0; box-sizing:border-box; }
      html,body { width:1920px; height:1080px; overflow:hidden; background:#090a0c; }
      body { font-family:"Inter",system-ui,sans-serif; color:#e8e4dc; }
      .wash { position:absolute; inset:0; pointer-events:none; opacity:0.05; background-size:16px 16px; image-rendering:pixelated; }
      .mask { overflow:hidden; display:block; padding:0.08em 0; margin:-0.08em 0; }
      #stage { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; }
      .kicker { font-family:"JetBrains Mono",monospace; font-size:26px; font-weight:500; letter-spacing:0.22em; text-transform:uppercase; color:#667078; margin-bottom:40px; }
      .display { font-size:132px; font-weight:700; letter-spacing:-0.045em; line-height:1.06; text-align:center; }
      #dotswrap { position:relative; width:640px; height:200px; margin:34px 0 30px; }
      #dotscv { position:absolute; inset:0; width:640px; height:200px; image-rendering:pixelated; }
      #dbloom { position:absolute; inset:0; width:640px; height:200px; mix-blend-mode:plus-lighter; filter:blur(8px) brightness(1.6) saturate(1.5); opacity:0.5; }
      #s2 { text-align:center; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="03-f3" data-start="0" data-duration="1.184" data-width="1920" data-height="1080" style="position:absolute; inset:0; overflow:hidden;">
      <div class="clip" data-start="0" data-duration="1.184" data-track-index="1"><div class="wash"></div></div>
      <div id="stage" class="clip" data-start="0" data-duration="1.184" data-track-index="2">
        <div class="kicker">The method</div>
        <div class="mask"><div class="display" id="s1">Run three.</div></div>
        <div id="dotswrap"><canvas id="dotscv" width="640" height="200"></canvas><canvas id="dbloom" width="640" height="200"></canvas></div>
        <div class="mask"><div class="display" id="s2">Ship one.</div></div>
      </div>
    </div>
    <script>
      document.querySelectorAll(".wash").forEach(function(el){ el.style.backgroundImage = window.__bayerURI("#aeb9c2", 0.5); });
      var state = { m: 0 };
      window.__dots(document.getElementById("dotscv"), state);
      var bloom = document.getElementById("dbloom").getContext("2d");
      function repaint(){ window.__dots(document.getElementById("dotscv"), state); bloom.clearRect(0,0,640,200); bloom.drawImage(document.getElementById("dotscv"), 0, 0); }
      repaint();
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused:true, defaults:{ ease:"power4.out" } });
      tl.fromTo("#s1", { yPercent:-112 }, { yPercent:0, duration:0.26 }, 0.02);
      tl.fromTo(".kicker", { yPercent:130, opacity:0 }, { yPercent:0, opacity:1, duration:0.28 }, 0.06);
      tl.fromTo("#s2", { x:-70, opacity:0 }, { x:0, opacity:1, duration:0.22, ease:"power3.out" }, 0.66);
      tl.to(state, { m:1, duration:0.34, ease:"power2.inOut", onUpdate:repaint }, 0.7);
      window.__timelines["03-f3"] = tl;
    </script>
  </body>
</html>
