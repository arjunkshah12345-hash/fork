<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__BAYER4 = [[0,8,2,10],[12,4,14,6],[3,11,1,9],[15,7,13,5]].map(function(r){return r.map(function(v){return (v+0.5)/16;});});
      window.__bayerURI = function(color, t){
        t = t == null ? 0.5 : t;
        var cells = "";
        for (var y=0;y<4;y++) for (var x=0;x<4;x++) if (window.__BAYER4[y][x] > t) cells += "<rect x='"+x+"' y='"+y+"' width='1' height='1' fill='"+color+"'/>";
        var svg = "<svg xmlns='http://www.w3.org/2000/svg' width='4' height='4' viewBox='0 0 4 4' shape-rendering='crispEdges'>"+cells+"</svg>";
        return "url(data:image/svg+xml;base64,"+btoa(svg)+")";
      };
    </script>
    <style>
      * { margin:0; padding:0; box-sizing:border-box; }
      html,body { width:1920px; height:1080px; overflow:hidden; background:#090a0c; }
      body { font-family:"Geist",system-ui,sans-serif; color:#e8e4dc; }
      .wash { position:absolute; inset:0; pointer-events:none; opacity:0.05; background-size:16px 16px; image-rendering:pixelated; }
      .mask { overflow:hidden; display:block; padding:0.08em 0; margin:-0.08em 0; }
      #p3d { position:absolute; inset:0; perspective:1300px; display:flex; align-items:center; justify-content:center; }
      #stage { display:flex; flex-direction:column; align-items:center; }
      .display { font-size:120px; font-weight:700; letter-spacing:-0.045em; line-height:1.05; margin-bottom:52px; }
      #panel { position:relative; border:1px solid #454c54; }
      #win { display:block; width:1376px; height:189px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="07-f7" data-start="0" data-duration="1.184" data-width="1920" data-height="1080" style="position:absolute; inset:0; overflow:hidden;">
      <div class="clip" data-start="0" data-duration="1.184" data-track-index="1"><div class="wash"></div></div>
      <div id="p3d" class="clip" data-start="0" data-duration="1.184" data-track-index="2">
        <div id="stage">
          <div class="mask"><div class="display" id="line1">One winner.</div></div>
          <div id="panel"><img id="win" src="assets/ui-winner.png" alt="" /></div>
        </div>
      </div>
    </div>
    <script>
      document.querySelectorAll(".wash").forEach(function(el){ el.style.backgroundImage = window.__bayerURI("#aeb9c2", 0.5); });
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused:true, defaults:{ ease:"power4.out" } });
      tl.fromTo("#line1", { yPercent:-112 }, { yPercent:0, duration:0.24 }, 0.02);
      tl.fromTo("#panel", { rotationX:15, scale:0.9, y:44 }, { rotationX:0, scale:1, y:0, duration:0.34, ease:"back.out(1.4)" }, 0.24);
      tl.to("#panel", { scale:1.1, duration:0.55, ease:"sine.inOut" }, 0.6);
      window.__timelines["07-f7"] = tl;
    </script>
  </body>
</html>
