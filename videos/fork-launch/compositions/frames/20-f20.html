<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__BAYER4 = [[0,8,2,10],[12,4,14,6],[3,11,1,9],[15,7,13,5]].map(function(r){return r.map(function(v){return (v+0.5)/16;});});
      window.__bayerURI = function(color, t){
        t = t == null ? 0.5 : t;
        var cells = "";
        for (var y=0;y<4;y++) for (var x=0;x<4;x++) if (window.__BAYER4[y][x] > t) cells += "<rect x='"+x+"' y='"+y+"' width='1' height='1' fill='"+color+"'/>";
        var svg = "<svg xmlns='http://www.w3.org/2000/svg' width='4' height='4' viewBox='0 0 4 4' shape-rendering='crispEdges'>"+cells+"</svg>";
        return "url(data:image/svg+xml;base64,"+btoa(svg)+")";
      };
    </script>
    <style>
      * { margin:0; padding:0; box-sizing:border-box; }
      html,body { width:1920px; height:1080px; overflow:hidden; background:#090a0c; }
      body { font-family:"Inter",system-ui,sans-serif; color:#ece9e2; }
      .wash { position:absolute; inset:0; pointer-events:none; opacity:0.05; background-size:16px 16px; image-rendering:pixelated; }
      #stage { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; }
      #lockup { display:flex; align-items:center; gap:48px; }
      #mark { width:140px; height:140px; }
      #word { font-size:200px; font-weight:700; letter-spacing:0.14em; }
      #tag { position:absolute; bottom:170px; left:0; right:0; text-align:center; font-family:"JetBrains Mono",monospace; font-size:22px; letter-spacing:0.3em; color:#989da1; text-transform:uppercase; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="20-f20" data-start="0" data-duration="0.39" data-width="1920" data-height="1080" style="position:absolute; inset:0; overflow:hidden;">
      <div class="clip" data-start="0" data-duration="0.39" data-track-index="1"><div class="wash"></div></div>
      <div id="stage" class="clip" data-start="0" data-duration="0.39" data-track-index="2">
        <div id="lockup">
          <svg id="mark" viewBox="0 0 64 64" aria-hidden="true">
            <rect x="1" y="1" width="62" height="62" fill="#0c0e10" stroke="#363b40" stroke-width="2"/>
            <path d="M14 16H22C22 26 26 32 36 32H48" fill="none" stroke="#358ff3" stroke-width="3" stroke-linecap="round"/>
            <path d="M14 32H48" fill="none" stroke="#966eff" stroke-width="3" stroke-linecap="round"/>
            <path d="M14 48H22C22 38 26 32 36 32" fill="none" stroke="#ff9632" stroke-width="3" stroke-linecap="round"/>
            <rect x="11" y="13" width="6" height="6" fill="#0c0e10" stroke="#358ff3" stroke-width="2"/>
            <rect x="11" y="29" width="6" height="6" fill="#0c0e10" stroke="#966eff" stroke-width="2"/>
            <rect x="11" y="45" width="6" height="6" fill="#0c0e10" stroke="#ff9632" stroke-width="2"/>
            <rect x="46" y="29" width="6" height="6" fill="#e8e4dc"/>
          </svg>
          <span id="word">FORK</span>
        </div>
        <div id="tag">Speculative execution for coding agents</div>
      </div>
    </div>
    <script>
      document.querySelectorAll(".wash").forEach(function(el){ el.style.backgroundImage = window.__bayerURI("#aeb9c2", 0.5); });
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused:true, defaults:{ ease:"power4.out" } });
      tl.fromTo("#tag", { y:14, opacity:0 }, { y:0, opacity:1, duration:0.22, ease:"power3.out" }, 0.06);
      tl.to("#mark", { scale:1.05, duration:0.16, ease:"power2.inOut" }, 0.06);
      tl.to("#mark", { scale:1, duration:0.14, ease:"power3.out" }, 0.24);
      window.__timelines["20-f20"] = tl;
    </script>
  </body>
</html>
