<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__BAYER4 = [[0,8,2,10],[12,4,14,6],[3,11,1,9],[15,7,13,5]].map(function(r){return r.map(function(v){return (v+0.5)/16;});});
      window.__bayerURI = function(color, t){
        t = t == null ? 0.5 : t;
        var cells = "";
        for (var y=0;y<4;y++) for (var x=0;x<4;x++) if (window.__BAYER4[y][x] > t) cells += "<rect x='"+x+"' y='"+y+"' width='1' height='1' fill='"+color+"'/>";
        var svg = "<svg xmlns='http://www.w3.org/2000/svg' width='4' height='4' viewBox='0 0 4 4' shape-rendering='crispEdges'>"+cells+"</svg>";
        return "url(data:image/svg+xml;base64,"+btoa(svg)+")";
      };
    </script>
    <style>
      * { margin:0; padding:0; box-sizing:border-box; }
      html,body { width:1920px; height:1080px; overflow:hidden; background:#090a0c; }
      body { font-family:"Inter",system-ui,sans-serif; color:#ece9e2; }
      .wash { position:absolute; inset:0; pointer-events:none; opacity:0.05; background-size:16px 16px; image-rendering:pixelated; }
      .kicker { font-family:"JetBrains Mono",monospace; font-size:20px; letter-spacing:0.22em; color:#8a959e; text-transform:uppercase; }
      #stage { position:absolute; left:180px; top:180px; }
      #hl { font-size:120px; font-weight:700; letter-spacing:-0.04em; line-height:1.05; }
      #term { margin-top:64px; background:#0c0e10; border:1px solid #25292d; width:760px; }
      #term .bar { display:flex; align-items:center; gap:10px; padding:14px 20px; border-bottom:1px solid #25292d; }
      #term .dot { width:12px; height:12px; border-radius:50%; }
      #term .title { margin-left:10px; font-family:"JetBrains Mono",monospace; font-size:15px; letter-spacing:0.1em; color:#667078; }
      #term .body { padding:24px 30px; font-family:"JetBrains Mono",monospace; font-size:30px; line-height:1.8; }
      #term .prompt { color:#667078; }
      #term .ok { color:#aeb9c2; }
      #term .ln { white-space:pre; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="26-f26" data-start="0" data-duration="0.48" data-width="1920" data-height="1080" style="position:absolute; inset:0; overflow:hidden;">
      <div class="clip" data-start="0" data-duration="0.48" data-track-index="1"><div class="wash"></div></div>
      <div id="stage" class="clip" data-start="0" data-duration="0.48" data-track-index="2">
        <div class="kicker" style="margin-bottom:20px;">RUN-THROUGH · SHIP</div>
        <div id="hl">Ship the best one.</div>
        <div id="term">
          <div class="bar">
            <span class="dot" style="background:#ff5f57;"></span>
            <span class="dot" style="background:#febc2e;"></span>
            <span class="dot" style="background:#28c840;"></span>
            <span class="title">fork — ship</span>
          </div>
          <div class="body">
            <div class="ln"><span class="prompt">$ </span><span class="ok" id="t1"></span></div>
          </div>
        </div>
      </div>
    </div>
    <script>
      document.querySelectorAll(".wash").forEach(function(el){ el.style.backgroundImage = window.__bayerURI("#aeb9c2", 0.5); });
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused:true, defaults:{ ease:"power4.out" } });
      tl.fromTo(".kicker", { y:10, opacity:0 }, { y:0, opacity:1, duration:0.12, ease:"power3.out" }, 0.0);
      tl.fromTo("#hl", { yPercent:112 }, { yPercent:0, duration:0.24, ease:"power4.out" }, 0.02);
      tl.fromTo("#term", { x:28, opacity:0 }, { x:0, opacity:1, duration:0.16, ease:"power3.out" }, 0.16);
      const p = { n:0 };
      tl.to(p, { n:9, duration:0.2, ease:"none", onUpdate:function(){ document.getElementById("t1").textContent = "fork ship".slice(0, Math.floor(p.n)) + "▍"; } }, 0.24);
      window.__timelines["26-f26"] = tl;
    </script>
  </body>
</html>
