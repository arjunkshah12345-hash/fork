<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__BAYER4 = [[0,8,2,10],[12,4,14,6],[3,11,1,9],[15,7,13,5]].map(function(r){return r.map(function(v){return (v+0.5)/16;});});
      window.__bayerURI = function(color, t){
        t = t == null ? 0.5 : t;
        var cells = "";
        for (var y=0;y<4;y++) for (var x=0;x<4;x++) if (window.__BAYER4[y][x] > t) cells += "<rect x='"+x+"' y='"+y+"' width='1' height='1' fill='"+color+"'/>";
        var svg = "<svg xmlns='http://www.w3.org/2000/svg' width='4' height='4' viewBox='0 0 4 4' shape-rendering='crispEdges'>"+cells+"</svg>";
        return "url(data:image/svg+xml;base64,"+btoa(svg)+")";
      };
    </script>
    <style>
      * { margin:0; padding:0; box-sizing:border-box; }
      html,body { width:1920px; height:1080px; overflow:hidden; background:#090a0c; }
      body { font-family:"Space Grotesk",system-ui,sans-serif; color:#e8e4dc; }
      .wash { position:absolute; inset:0; pointer-events:none; opacity:0.05; background-size:16px 16px; image-rendering:pixelated; }
      .mask { overflow:hidden; display:block; padding:0.18em 0; margin:-0.18em 0; }
      #stage { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; }
      #fade { display:flex; flex-direction:column; align-items:center; }
      .kicker { font-family:"IBM Plex Mono",monospace; font-size:24px; font-weight:500; letter-spacing:0.22em; text-transform:uppercase; color:#667078; }
      #word { font-size:118px; font-weight:700; letter-spacing:0.18em; margin-top:30px; }
      #tag { font-family:"IBM Plex Mono",monospace; font-size:25px; letter-spacing:0.2em; text-transform:uppercase; color:#aeb9c2; margin-top:22px; }
      #card { margin-top:64px; background:#131619; border:1px solid #3a4045; padding:46px 72px; display:flex; flex-direction:column; align-items:center; gap:20px; }
      #ckick { font-family:"IBM Plex Mono",monospace; font-size:20px; letter-spacing:0.22em; text-transform:uppercase; color:#8a9092; display:flex; align-items:center; gap:12px; }
      #ckick i { width:9px; height:9px; background:#28d26e; }
      #url { font-family:"IBM Plex Mono",monospace; font-size:36px; font-weight:500; color:#e8e4dc; letter-spacing:0.01em; text-decoration:underline; text-underline-offset:12px; text-decoration-color:#4a5156; text-decoration-thickness:2px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="09-f9" data-start="0" data-duration="2.047" data-width="1920" data-height="1080" style="position:absolute; inset:0; overflow:hidden;">
      <div class="clip" data-start="0" data-duration="2.047" data-track-index="1"><div class="wash"></div></div>
      <div id="stage" class="clip" data-start="0" data-duration="2.047" data-track-index="2">
        <div id="fade">
          <div class="kicker" id="k1">Open source</div>
          <div class="mask"><div id="word">FORK</div></div>
          <div class="mask"><div id="tag">Run three. Ship one.</div></div>
          <div id="card">
            <div id="ckick"><i></i>View on GitHub</div>
            <div id="url">github.com/arjunkshah12345-hash/fork</div>
          </div>
        </div>
      </div>
    </div>
    <script>
      document.querySelectorAll(".wash").forEach(function(el){ el.style.backgroundImage = window.__bayerURI("#aeb9c2", 0.5); });
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused:true, defaults:{ ease:"power4.out" } });
      tl.fromTo("#k1", { yPercent:130, opacity:0 }, { yPercent:0, opacity:1, duration:0.28 }, 0.02);
      tl.fromTo("#word", { yPercent:120 }, { yPercent:0, duration:0.3 }, 0.14);
      tl.fromTo("#tag", { yPercent:130, opacity:0 }, { yPercent:0, opacity:1, duration:0.28 }, 0.36);
      tl.fromTo("#card", { rotationX:14, scale:0.9, y:34 }, { rotationX:0, scale:1, y:0, duration:0.36, ease:"back.out(1.5)" }, 0.52);
      tl.to("#fade", { autoAlpha:0, duration:0.32, ease:"power2.in" }, 1.72);
      window.__timelines["09-f9"] = tl;
    </script>
  </body>
</html>
