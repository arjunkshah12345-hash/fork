<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__BAYER4 = [[0,8,2,10],[12,4,14,6],[3,11,1,9],[15,7,13,5]].map(function(r){return r.map(function(v){return (v+0.5)/16;});});
      window.__bayerURI = function(color, t){
        t = t == null ? 0.5 : t;
        var cells = "";
        for (var y=0;y<4;y++) for (var x=0;x<4;x++) if (window.__BAYER4[y][x] > t) cells += "<rect x='"+x+"' y='"+y+"' width='1' height='1' fill='"+color+"'/>";
        var svg = "<svg xmlns='http://www.w3.org/2000/svg' width='4' height='4' viewBox='0 0 4 4' shape-rendering='crispEdges'>"+cells+"</svg>";
        return "url(data:image/svg+xml;base64,"+btoa(svg)+")";
      };
      window.__stormURI = function(){
        var cells = "";
        for (var y=0;y<4;y++) for (var x=0;x<4;x++){
          var v = window.__BAYER4[y][x];
          var c = v > 0.85 ? "#358ff3" : v > 0.68 ? "#966eff" : v > 0.50 ? "#ff9632" : v > 0.30 ? "#28d26e" : null;
          if (c) cells += "<rect x='"+x+"' y='"+y+"' width='1' height='1' fill='"+c+"'/>";
        }
        var svg = "<svg xmlns='http://www.w3.org/2000/svg' width='4' height='4' viewBox='0 0 4 4' shape-rendering='crispEdges'>"+cells+"</svg>";
        return "url(data:image/svg+xml;base64,"+btoa(svg)+")";
      };
    </script>
    <style>
      * { margin:0; padding:0; box-sizing:border-box; }
      html,body { width:1920px; height:1080px; overflow:hidden; background:#090a0c; }
      body { font-family:"Inter",system-ui,sans-serif; color:#ece9e2; }
      .storm { position:absolute; inset:0; pointer-events:none; image-rendering:pixelated; background-repeat:repeat; background-size:14px 14px; opacity:0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="06-f6" data-start="0" data-duration="0.395" data-width="1920" data-height="1080" style="position:absolute; inset:0; overflow:hidden;">
      <div class="clip" data-start="0" data-duration="0.395" data-track-index="1"><div class="storm" id="storm"></div></div>
    </div>
    <script>
      document.getElementById("storm").style.backgroundImage = window.__stormURI();
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused:true, defaults:{ ease:"power4.out" } });
      tl.to("#storm", { opacity:0.95, duration:0.1, ease:"power2.in" }, 0.0);
      tl.to("#storm", { opacity:0.9, duration:0.1 }, 0.1);
      tl.to("#storm", { opacity:0.04, duration:0.26, ease:"power3.out" }, 0.22);
      window.__timelines["06-f6"] = tl;
    </script>
  </body>
</html>
