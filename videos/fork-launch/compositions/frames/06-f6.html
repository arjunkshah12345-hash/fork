<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__BAYER4 = [[0,8,2,10],[12,4,14,6],[3,11,1,9],[15,7,13,5]].map(function(r){return r.map(function(v){return (v+0.5)/16;});});
      window.__bayerURI = function(color, t){
        t = t == null ? 0.5 : t;
        var cells = "";
        for (var y=0;y<4;y++) for (var x=0;x<4;x++) if (window.__BAYER4[y][x] > t) cells += "<rect x='"+x+"' y='"+y+"' width='1' height='1' fill='"+color+"'/>";
        var svg = "<svg xmlns='http://www.w3.org/2000/svg' width='4' height='4' viewBox='0 0 4 4' shape-rendering='crispEdges'>"+cells+"</svg>";
        return "url(data:image/svg+xml;base64,"+btoa(svg)+")";
      };
    </script>
    <style>
      * { margin:0; padding:0; box-sizing:border-box; }
      html,body { width:1920px; height:1080px; overflow:hidden; background:#090a0c; }
      body { font-family:"Space Grotesk",system-ui,sans-serif; color:#e8e4dc; }
      .wash { position:absolute; inset:0; pointer-events:none; opacity:0.05; background-size:16px 16px; image-rendering:pixelated; }
      #p3d { position:absolute; inset:0; perspective:1400px; display:flex; align-items:center; justify-content:center; }
      #stage { display:flex; flex-direction:column; align-items:center; }
      .kicker { font-family:"IBM Plex Mono",monospace; font-size:26px; font-weight:500; letter-spacing:0.22em; text-transform:uppercase; color:#667078; margin-bottom:36px; }
      #panel { position:relative; border:1px solid #2f3438; }
      #ev { display:block; width:1376px; height:522px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="06-f6" data-start="0" data-duration="1.184" data-width="1920" data-height="1080" style="position:absolute; inset:0; overflow:hidden;">
      <div class="clip" data-start="0" data-duration="1.184" data-track-index="1"><div class="wash"></div></div>
      <div id="p3d" class="clip" data-start="0" data-duration="1.184" data-track-index="2">
        <div id="stage">
          <div class="kicker" id="kick">The evidence decides.</div>
          <div id="panel"><img id="ev" src="assets/ui-evidence.png" alt="" /></div>
        </div>
      </div>
    </div>
    <script>
      document.querySelectorAll(".wash").forEach(function(el){ el.style.backgroundImage = window.__bayerURI("#aeb9c2", 0.5); });
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused:true, defaults:{ ease:"power4.out" } });
      tl.fromTo("#kick", { yPercent:130, opacity:0 }, { yPercent:0, opacity:1, duration:0.24 }, 0.02);
      tl.fromTo("#panel", { rotationX:12, rotationY:-7, y:70, scale:0.94 }, { rotationX:0, rotationY:0, y:0, scale:1, duration:0.5 }, 0.1);
      tl.to("#panel", { scale:1.03, duration:0.5, ease:"sine.inOut" }, 0.62);
      window.__timelines["06-f6"] = tl;
    </script>
  </body>
</html>
