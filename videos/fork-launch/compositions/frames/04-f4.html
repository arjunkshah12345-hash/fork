<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__BAYER4 = [[0,8,2,10],[12,4,14,6],[3,11,1,9],[15,7,13,5]].map(function(r){return r.map(function(v){return (v+0.5)/16;});});
      window.__bayerURI = function(color, t){
        t = t == null ? 0.5 : t;
        var cells = "";
        for (var y=0;y<4;y++) for (var x=0;x<4;x++) if (window.__BAYER4[y][x] > t) cells += "<rect x='"+x+"' y='"+y+"' width='1' height='1' fill='"+color+"'/>";
        var svg = "<svg xmlns='http://www.w3.org/2000/svg' width='4' height='4' viewBox='0 0 4 4' shape-rendering='crispEdges'>"+cells+"</svg>";
        return "url(data:image/svg+xml;base64,"+btoa(svg)+")";
      };
      window.__mk = (function(){
        var B = window.__BAYER4, C = { blue:[53,143,243], purple:[150,110,255], orange:[255,150,50], ivory:[232,228,220] };
        var CELL = 7, SIZE = 440;
        var T = { blue:[[14,16],[24,16],[32,26],[36,32],[48,32]], purple:[[14,32],[48,32]], orange:[[14,48],[24,48],[32,38],[36,32]] };
        var SQ = { blue:[11,13], purple:[11,29], orange:[11,45] };
        function segPts(pts){ var o=[]; for(var i=0;i<pts.length-1;i++){ var x0=pts[i][0],y0=pts[i][1],x1=pts[i+1][0],y1=pts[i+1][1]; var n=Math.max(Math.abs(x1-x0),Math.abs(y1-y0)); for(var j=0;j<=n;j++){ o.push([Math.round(x0+(x1-x0)*j/n),Math.round(y0+(y1-y0)*j/n)]); } } return o; }
        var P = {}; for(var k in T) P[k] = segPts(T[k]);
        var cv, bc, ctx, bctx;
        function ensure(){ if(!cv){ cv=document.getElementById("mk-cv"); bc=document.getElementById("mk-bloom"); ctx=cv.getContext("2d"); bctx=bc.getContext("2d"); } }
        function rgb(c,a){ return "rgba("+c[0]+","+c[1]+","+c[2]+","+a+")"; }
        function cell(x,y,color,density){ var lit=density>B[y&3][x&3]; var a=lit?0.3+density*0.7:(0.3+density*0.7)*0.28; ctx.fillStyle=rgb(color,a); ctx.fillRect(x*CELL,y*CELL,CELL,CELL); }
        function stroke(color,key,prog){ var pts=P[key], up=Math.floor(prog*(pts.length-1)); for(var i=0;i<=up;i++){ var gx=pts[i][0],gy=pts[i][1]; for(var dy=-1;dy<=1;dy++)for(var dx=-1;dx<=1;dx++){ var d=Math.abs(dx)+Math.abs(dy); cell(gx+dx,gy+dy,color,d===0?0.92:d===1?0.55:0.38); } } }
        function square(key,prog){ var s=SQ[key], cols=Math.max(1,Math.round(prog*6)); for(var x=s[0];x<s[0]+cols;x++)for(var y=s[1];y<s[1]+6;y++){ var lit=0.62>B[y&3][x&3]; ctx.fillStyle=rgb(C[key],lit?0.85:0.25); ctx.fillRect(x*CELL,y*CELL,CELL,CELL); } }
        function node(scale){ if(scale<=0.02)return; var h=3*scale,cx=49,cy=32; for(var x=Math.floor(cx-h);x<=Math.ceil(cx+h);x++)for(var y=Math.floor(cy-h);y<=Math.ceil(cy+h);y++){ ctx.fillStyle=rgb(C.ivory,0.96); ctx.fillRect(x*CELL,y*CELL,CELL,CELL); } }
        return { paint:function(s){ ensure(); ctx.clearRect(0,0,SIZE,SIZE); stroke(C.blue,"blue",s.b1); stroke(C.purple,"purple",s.b2); stroke(C.orange,"orange",s.b3); square("blue",s.q1); square("purple",s.q2); square("orange",s.q3); node(s.n); bctx.clearRect(0,0,SIZE,SIZE); bctx.drawImage(cv,0,0); } };
      })();
    </script>
    <style>
      * { margin:0; padding:0; box-sizing:border-box; }
      html,body { width:1920px; height:1080px; overflow:hidden; background:#090a0c; }
      body { font-family:"Space Grotesk",system-ui,sans-serif; color:#e8e4dc; }
      .wash { position:absolute; inset:0; pointer-events:none; opacity:0.05; background-size:16px 16px; image-rendering:pixelated; }
      #p3d { position:absolute; inset:0; perspective:1400px; }
      #stage { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; }
      .kicker { font-family:"IBM Plex Mono",monospace; font-size:26px; font-weight:500; letter-spacing:0.22em; text-transform:uppercase; color:#667078; margin-bottom:40px; }
      #wrap { position:relative; width:400px; height:400px; transform-style:preserve-3d; }
      canvas { position:absolute; inset:0; width:400px; height:400px; image-rendering:pixelated; }
      #mk-bloom { mix-blend-mode:plus-lighter; filter:blur(6px) brightness(1.6) saturate(1.5); opacity:0.6; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="04-f4" data-start="0" data-duration="1.185" data-width="1920" data-height="1080" style="position:absolute; inset:0; overflow:hidden;">
      <div class="clip" data-start="0" data-duration="1.185" data-track-index="1"><div class="wash"></div></div>
      <div id="p3d" class="clip" data-start="0" data-duration="1.185" data-track-index="2">
        <div id="stage">
          <div class="kicker" id="kick">Introducing FORK</div>
          <div id="wrap"><canvas id="mk-cv" width="440" height="440"></canvas><canvas id="mk-bloom" width="440" height="440"></canvas></div>
        </div>
      </div>
    </div>
    <script>
      document.querySelectorAll(".wash").forEach(function(el){ el.style.backgroundImage = window.__bayerURI("#aeb9c2", 0.5); });
      var state = { b1:0, b2:0, b3:0, q1:0, q2:0, q3:0, n:0 };
      window.__mk.paint(state);
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused:true, defaults:{ ease:"power4.out" } });
      tl.fromTo("#wrap", { rotationX:18, y:50 }, { rotationX:3, y:0, duration:0.4, ease:"power3.out" }, 0.02);
      tl.fromTo("#kick", { yPercent:130, opacity:0 }, { yPercent:0, opacity:1, duration:0.26 }, 0.05);
      tl.to(state, { b1:1, duration:0.3, ease:"power2.inOut", onUpdate:function(){ window.__mk.paint(state); } }, 0.02);
      tl.to(state, { b2:1, duration:0.3, ease:"power2.inOut", onUpdate:function(){ window.__mk.paint(state); } }, 0.28);
      tl.to(state, { b3:1, duration:0.3, ease:"power2.inOut", onUpdate:function(){ window.__mk.paint(state); } }, 0.54);
      tl.to(state, { q1:1, q2:1, q3:1, duration:0.12, ease:"power4.out", onUpdate:function(){ window.__mk.paint(state); } }, 0.82);
      tl.to(state, { n:1, duration:0.2, ease:"back.out(2)", onUpdate:function(){ window.__mk.paint(state); } }, 0.9);
      window.__timelines["04-f4"] = tl;
    </script>
  </body>
</html>
