<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__BAYER4 = [[0,8,2,10],[12,4,14,6],[3,11,1,9],[15,7,13,5]].map(function(r){return r.map(function(v){return (v+0.5)/16;});});
      window.__bayerURI = function(color, t){
        t = t == null ? 0.5 : t;
        var cells = "";
        for (var y=0;y<4;y++) for (var x=0;x<4;x++) if (window.__BAYER4[y][x] > t) cells += "<rect x='"+x+"' y='"+y+"' width='1' height='1' fill='"+color+"'/>";
        var svg = "<svg xmlns='http://www.w3.org/2000/svg' width='4' height='4' viewBox='0 0 4 4' shape-rendering='crispEdges'>"+cells+"</svg>";
        return "url(data:image/svg+xml;base64,"+btoa(svg)+")";
      };
      window.__node = function(cv, color){
        var ctx = cv.getContext("2d"); var S = 180, CELL = 3, B = window.__BAYER4;
        var cx = S/2, cy = S/2, R = S*0.42;
        ctx.clearRect(0,0,S,S);
        for (var y=0; y<S; y+=CELL) for (var x=0; x<S; x+=CELL){
          var dx = x+CELL/2-cx, dy = y+CELL/2-cy;
          var dist = Math.sqrt(dx*dx+dy*dy);
          if (dist < R){
            var density = 1 - dist/R;
            var lit = density > B[(y/CELL)&3][(x/CELL)&3];
            var a = lit ? 0.35 + density*0.65 : (0.35+density*0.65)*0.3;
            ctx.fillStyle = "rgba("+color[0]+","+color[1]+","+color[2]+","+a+")";
            ctx.fillRect(x,y,CELL,CELL);
          }
        }
      };
    </script>
    <style>
      * { margin:0; padding:0; box-sizing:border-box; }
      html,body { width:1920px; height:1080px; overflow:hidden; background:#090a0c; }
      body { font-family:"Inter",system-ui,sans-serif; color:#ece9e2; }
      .wash { position:absolute; inset:0; pointer-events:none; opacity:0.05; background-size:16px 16px; image-rendering:pixelated; }
      .kicker { font-family:"JetBrains Mono",monospace; font-size:22px; letter-spacing:0.22em; color:#8a959e; text-transform:uppercase; }
      #stage { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; }
      #wrap { position:relative; width:180px; height:180px; margin-bottom:46px; }
      canvas { position:absolute; inset:0; width:180px; height:180px; image-rendering:pixelated; }
      #bloom { mix-blend-mode:plus-lighter; filter:blur(8px) brightness(1.6) saturate(1.3); opacity:0.6; }
      .display { font-size:120px; font-weight:700; letter-spacing:-0.04em; line-height:1.05; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="05-f5" data-start="0" data-duration="1.603" data-width="1920" data-height="1080" style="position:absolute; inset:0; overflow:hidden;">
      <div class="clip" data-start="0" data-duration="1.603" data-track-index="1"><div class="wash"></div></div>
      <div id="stage" class="clip" data-start="0" data-duration="1.603" data-track-index="2">
        <div class="kicker" style="margin-bottom:26px;">The evidence decides</div>
        <div id="wrap"><canvas id="cv" width="180" height="180"></canvas><canvas id="bloom" width="180" height="180"></canvas></div>
        <div class="display" id="big">One winner.</div>
      </div>
    </div>
    <script>
      document.querySelectorAll(".wash").forEach(function(el){ el.style.backgroundImage = window.__bayerURI("#aeb9c2", 0.5); });
      window.__node(document.getElementById("cv"), [232,228,220]);
      var bctx = document.getElementById("bloom").getContext("2d");
      bctx.drawImage(document.getElementById("cv"), 0, 0);
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused:true, defaults:{ ease:"power4.out" } });
      tl.fromTo("#stage .kicker", { y:12, opacity:0 }, { y:0, opacity:1, duration:0.4, ease:"power2.out" }, 0.08);
      tl.fromTo("#wrap", { scale:0.85, opacity:0 }, { scale:1, opacity:1, duration:0.6, ease:"power2.out" }, 0.12);
      tl.fromTo("#big", { y:18, opacity:0 }, { y:0, opacity:1, duration:0.5, ease:"power3.out" }, 0.4);
      tl.to("#wrap", { scale:1.04, duration:0.3, ease:"sine.inOut" }, 0.95);
      tl.to("#wrap", { scale:1, duration:0.3, ease:"sine.inOut" }, 1.25);
      window.__timelines["05-f5"] = tl;
    </script>
  </body>
</html>
