<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__BAYER4 = [[0,8,2,10],[12,4,14,6],[3,11,1,9],[15,7,13,5]].map(function(r){return r.map(function(v){return (v+0.5)/16;});});
      window.__bayerURI = function(color, t){
        t = t == null ? 0.5 : t;
        var cells = "";
        for (var y=0;y<4;y++) for (var x=0;x<4;x++) if (window.__BAYER4[y][x] > t) cells += "<rect x='"+x+"' y='"+y+"' width='1' height='1' fill='"+color+"'/>";
        var svg = "<svg xmlns='http://www.w3.org/2000/svg' width='4' height='4' viewBox='0 0 4 4' shape-rendering='crispEdges'>"+cells+"</svg>";
        return "url(data:image/svg+xml;base64,"+btoa(svg)+")";
      };
      window.__redBar = function(cv, frac, cols, rows){
        var ctx = cv.getContext("2d"); ctx.clearRect(0,0,cols,rows);
        var B = window.__BAYER4;
        var w = Math.max(1, Math.round(frac*(cols-1)));
        for (var x=0;x<=w;x++){
          for (var y=0;y<rows;y++){
            var density = x/Math.max(1,w);
            var lit = density > B[y&3][x&3];
            var k = 0.25 + density*0.75;
            var a = lit ? k : k*0.35;
            ctx.fillStyle = "rgba(240,70,70,"+a+")"; ctx.fillRect(x,y,1,1);
          }
          ctx.fillStyle = "rgba(240,70,70,0.9)"; ctx.fillRect(w,y,1,1);
        }
      };
    </script>
    <style>
      * { margin:0; padding:0; box-sizing:border-box; }
      html,body { width:1920px; height:1080px; overflow:hidden; background:#090a0c; }
      body { font-family:"Inter",system-ui,sans-serif; color:#ece9e2; }
      .wash { position:absolute; inset:0; pointer-events:none; opacity:0.05; background-size:16px 16px; image-rendering:pixelated; }
      .kicker { font-family:"JetBrains Mono",monospace; font-size:20px; letter-spacing:0.22em; color:#8a959e; text-transform:uppercase; }
      #stat { position:absolute; left:180px; top:330px; width:1560px; }
      #stat .row { display:flex; align-items:baseline; justify-content:space-between; margin-bottom:24px; }
      #stat .lab { font-family:"JetBrains Mono",monospace; font-size:20px; letter-spacing:0.2em; color:#667078; text-transform:uppercase; }
      #stat .val { font-family:"JetBrains Mono",monospace; font-size:34px; color:#ff6b6b; }
      #bar { position:relative; width:100%; height:110px; }
      canvas { position:absolute; inset:0; width:100%; height:100%; image-rendering:pixelated; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="05-f5" data-start="0" data-duration="0.49" data-width="1920" data-height="1080" style="position:absolute; inset:0; overflow:hidden;">
      <div class="clip" data-start="0" data-duration="0.49" data-track-index="1"><div class="wash"></div></div>
      <div id="stat" class="clip" data-start="0" data-duration="0.49" data-track-index="2">
        <div class="kicker" style="margin-bottom:30px;">ONE SHOT IS A GAMBLE</div>
        <div class="row">
          <span class="lab">P(first answer wins)</span>
          <span class="val" id="pct">100%</span>
        </div>
        <div id="bar"><canvas id="cv" width="390" height="28"></canvas></div>
      </div>
    </div>
    <script>
      document.querySelectorAll(".wash").forEach(function(el){ el.style.backgroundImage = window.__bayerURI("#aeb9c2", 0.5); });
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused:true, defaults:{ ease:"power4.out" } });
      tl.fromTo(".kicker", { y:12, opacity:0 }, { y:0, opacity:1, duration:0.14, ease:"power3.out" }, 0.0);
      const cv = document.getElementById("cv");
      const st = { frac:1 };
      function repaint(){ window.__redBar(cv, st.frac, 390, 28); }
      repaint();
      const pct = { v:100 };
      tl.to(st, { frac:0.28, duration:0.34, ease:"power2.inOut", onUpdate:repaint }, 0.1);
      tl.to(pct, { v:28, duration:0.34, ease:"power2.inOut", onUpdate:function(){ document.getElementById("pct").textContent = Math.round(pct.v)+"%"; } }, 0.1);
      window.__timelines["05-f5"] = tl;
    </script>
  </body>
</html>
