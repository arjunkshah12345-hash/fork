<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__BAYER4 = [[0,8,2,10],[12,4,14,6],[3,11,1,9],[15,7,13,5]].map(function(r){return r.map(function(v){return (v+0.5)/16;});});
      window.__bayerURI = function(color, t){
        t = t == null ? 0.5 : t;
        var cells = "";
        for (var y=0;y<4;y++) for (var x=0;x<4;x++) if (window.__BAYER4[y][x] > t) cells += "<rect x='"+x+"' y='"+y+"' width='1' height='1' fill='"+color+"'/>";
        var svg = "<svg xmlns='http://www.w3.org/2000/svg' width='4' height='4' viewBox='0 0 4 4' shape-rendering='crispEdges'>"+cells+"</svg>";
        return "url(data:image/svg+xml;base64,"+btoa(svg)+")";
      };
    </script>
    <style>
      * { margin:0; padding:0; box-sizing:border-box; }
      html,body { width:1920px; height:1080px; overflow:hidden; background:#090a0c; }
      body { font-family:"Geist",system-ui,sans-serif; color:#e8e4dc; }
      .wash { position:absolute; inset:0; pointer-events:none; opacity:0.05; background-size:16px 16px; image-rendering:pixelated; }
      #p3d { position:absolute; inset:0; perspective:1500px; }
      #ui { position:absolute; top:0; left:0; width:1920px; height:1000px; display:block; }
      .chip { position:absolute; background:#15181d; border:1px solid #3a4045; padding:13px 20px; font-family:"Geist Mono",monospace; font-size:19px; color:#c4c8c7; display:flex; align-items:center; gap:12px; }
      .chip i { width:10px; height:10px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="05-f5" data-start="0" data-duration="1.184" data-width="1920" data-height="1080" style="position:absolute; inset:0; overflow:hidden;">
      <div class="clip" data-start="0" data-duration="1.184" data-track-index="1"><div class="wash"></div></div>
      <div id="p3d" class="clip" data-start="0" data-duration="1.184" data-track-index="2">
        <img id="ui" src="assets/ui-dashboard.png" alt="" />
        <div class="chip" id="c1" style="left:96px; top:270px;"><i style="background:#358ff3;"></i>Codex &times; 3</div>
        <div class="chip" id="c2" style="right:96px; top:200px;"><i style="background:#966eff;"></i>3 worktrees</div>
        <div class="chip" id="c3" style="right:150px; top:880px;"><i style="background:#28d26e;"></i>SuperCompress &minus;38%</div>
      </div>
    </div>
    <script>
      document.querySelectorAll(".wash").forEach(function(el){ el.style.backgroundImage = window.__bayerURI("#aeb9c2", 0.5); });
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused:true, defaults:{ ease:"power4.out" } });
      tl.fromTo("#ui", { rotationX:9, y:42, scale:0.95 }, { rotationX:0, y:0, scale:1, duration:0.5 }, 0.02);
      tl.to("#ui", { scale:1.03, duration:0.6, ease:"sine.inOut" }, 0.52);
      tl.fromTo("#c1", { scale:0, y:26 }, { scale:1, y:0, duration:0.2, ease:"back.out(2.2)" }, 0.5);
      tl.fromTo("#c2", { scale:0, y:22 }, { scale:1, y:0, duration:0.2, ease:"back.out(2.2)" }, 0.62);
      tl.fromTo("#c3", { scale:0, y:20 }, { scale:1, y:0, duration:0.2, ease:"back.out(2.2)" }, 0.74);
      window.__timelines["05-f5"] = tl;
    </script>
  </body>
</html>
