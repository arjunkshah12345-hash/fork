<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__BAYER4 = [[0,8,2,10],[12,4,14,6],[3,11,1,9],[15,7,13,5]].map(function(r){return r.map(function(v){return (v+0.5)/16;});});
      window.__bayerURI = function(color, t){
        t = t == null ? 0.5 : t;
        var cells = "";
        for (var y=0;y<4;y++) for (var x=0;x<4;x++) if (window.__BAYER4[y][x] > t) cells += "<rect x='"+x+"' y='"+y+"' width='1' height='1' fill='"+color+"'/>";
        var svg = "<svg xmlns='http://www.w3.org/2000/svg' width='4' height='4' viewBox='0 0 4 4' shape-rendering='crispEdges'>"+cells+"</svg>";
        return "url(data:image/svg+xml;base64,"+btoa(svg)+")";
      };
    </script>
    <style>
      * { margin:0; padding:0; box-sizing:border-box; }
      html,body { width:1920px; height:1080px; overflow:hidden; background:#090a0c; }
      body { font-family:"Inter",system-ui,sans-serif; color:#ece9e2; }
      .wash { position:absolute; inset:0; pointer-events:none; opacity:0.05; background-size:16px 16px; image-rendering:pixelated; }
      .kicker { font-family:"JetBrains Mono",monospace; font-size:22px; letter-spacing:0.22em; color:#8a959e; text-transform:uppercase; }
      .mask { overflow:hidden; display:block; padding:0.08em 0; margin:-0.08em 0; }
      .line { will-change:transform; }
      .display { font-size:170px; font-weight:700; letter-spacing:-0.04em; line-height:1.05; }
      .dim { color:#aeb9c2; }
      #copy { position:absolute; left:180px; top:210px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="01-f1" data-start="0" data-duration="0.88" data-width="1920" data-height="1080" style="position:absolute; inset:0; overflow:hidden;">
      <div class="clip" data-start="0" data-duration="0.88" data-track-index="1"><div class="wash"></div></div>
      <div id="copy" class="clip" data-start="0" data-duration="0.88" data-track-index="2">
        <div class="kicker" style="margin-bottom:28px;">THE PROBLEM</div>
        <div class="mask"><div class="line display" id="l1">One shot.</div></div>
        <div class="mask"><div class="line display dim" id="l2">One answer.</div></div>
      </div>
    </div>
    <script>
      document.querySelectorAll(".wash").forEach(function(el){ el.style.backgroundImage = window.__bayerURI("#aeb9c2", 0.5); });
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused:true, defaults:{ ease:"power4.out" } });
      tl.fromTo("#copy .kicker", { y:14, opacity:0 }, { y:0, opacity:1, duration:0.18, ease:"power3.out" }, 0.02);
      tl.fromTo("#l1", { yPercent:112 }, { yPercent:0, duration:0.36, ease:"power4.out" }, 0.05);
      tl.fromTo("#l2", { yPercent:112 }, { yPercent:0, duration:0.32, ease:"expo.out" }, 0.3);
      window.__timelines["01-f1"] = tl;
    </script>
  </body>
</html>
