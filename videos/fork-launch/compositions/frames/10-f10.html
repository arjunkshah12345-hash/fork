<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__BAYER4 = [[0,8,2,10],[12,4,14,6],[3,11,1,9],[15,7,13,5]].map(function(r){return r.map(function(v){return (v+0.5)/16;});});
      window.__bayerURI = function(color, t){
        t = t == null ? 0.5 : t;
        var cells = "";
        for (var y=0;y<4;y++) for (var x=0;x<4;x++) if (window.__BAYER4[y][x] > t) cells += "<rect x='"+x+"' y='"+y+"' width='1' height='1' fill='"+color+"'/>";
        var svg = "<svg xmlns='http://www.w3.org/2000/svg' width='4' height='4' viewBox='0 0 4 4' shape-rendering='crispEdges'>"+cells+"</svg>";
        return "url(data:image/svg+xml;base64,"+btoa(svg)+")";
      };
    </script>
    <style>
      * { margin:0; padding:0; box-sizing:border-box; }
      html,body { width:1920px; height:1080px; overflow:hidden; background:#090a0c; }
      body { font-family:"Inter",system-ui,sans-serif; color:#ece9e2; }
      .wash { position:absolute; inset:0; pointer-events:none; opacity:0.05; background-size:16px 16px; image-rendering:pixelated; }
      #stage { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; }
      #markwrap { position:relative; width:440px; height:440px; }
      #markcv, #markbloom { position:absolute; inset:0; width:440px; height:440px; image-rendering:pixelated; }
      #markbloom { mix-blend-mode:plus-lighter; filter:blur(6px) brightness(1.6) saturate(1.5); opacity:0.6; }
      #word { font-size:120px; font-weight:700; letter-spacing:0.16em; margin-top:8px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="10-f10" data-start="0" data-duration="0.97" data-width="1920" data-height="1080" style="position:absolute; inset:0; overflow:hidden;">
      <div class="clip" data-start="0" data-duration="0.97" data-track-index="1"><div class="wash"></div></div>
      <div id="stage" class="clip" data-start="0" data-duration="0.97" data-track-index="2">
        <div id="markwrap">
          <canvas id="markcv" width="440" height="440"></canvas>
          <canvas id="markbloom" width="440" height="440"></canvas>
        </div>
        <div id="word">FORK</div>
      </div>
    </div>
    <script>
      document.querySelectorAll(".wash").forEach(function(el){ el.style.backgroundImage = window.__bayerURI("#aeb9c2", 0.5); });
      window.__mark = (function(){
        var BAYER = window.__BAYER4;
        var BLUE=[53,143,243], PURPLE=[150,110,255], ORANGE=[255,150,50], IVORY=[232,228,220];
        var CELL=7, SIZE=440;
        var cv = document.getElementById("markcv");
        var bc = document.getElementById("markbloom");
        var ctx = cv.getContext("2d");
        var bctx = bc.getContext("2d");
        function rgb(c,a){ return "rgba("+c[0]+","+c[1]+","+c[2]+","+a+")"; }
        function cubic(p0,c1,c2,p1,n){ var o=[]; for(var i=0;i<=n;i++){ var t=i/n, mt=1-t; o.push([mt*mt*mt*p0[0]+3*mt*mt*t*c1[0]+3*mt*t*t*c2[0]+t*t*t*p1[0], mt*mt*mt*p0[1]+3*mt*mt*t*c1[1]+3*mt*t*t*c2[1]+t*t*t*p1[1]]); } return o; }
        function line(p0,p1,n){ var o=[]; for(var i=0;i<=n;i++){ var t=i/n; o.push([p0[0]+(p1[0]-p0[0])*t, p0[1]+(p1[1]-p0[1])*t]); } return o; }
        var tineTop = line([14,16],[22,16],5).concat(cubic([22,16],[22,26],[26,32],[36,32],20), line([36,32],[48,32],9));
        var tineMid = line([14,32],[48,32],28);
        var tineBot = line([14,48],[22,48],5).concat(cubic([22,48],[22,38],[26,32],[36,32],20));
        var branches = [ {pts:tineTop,c:BLUE}, {pts:tineMid,c:PURPLE}, {pts:tineBot,c:ORANGE} ];
        var squares = [ {x:11,y:13,c:BLUE}, {x:11,y:29,c:PURPLE}, {x:11,y:45,c:ORANGE} ];
        function cell(x,y,color,density){ var lit = density > BAYER[y&3][x&3]; var a = lit ? 0.3+density*0.7 : (0.3+density*0.7)*0.28; ctx.fillStyle=rgb(color,a); ctx.fillRect(x*CELL,y*CELL,CELL,CELL); }
        function paintStroke(color,pts,progress){ var upto=Math.floor(progress*(pts.length-1)); for(var i=0;i<=upto;i++){ var gx=Math.round(pts[i][0]), gy=Math.round(pts[i][1]); for(var dy=-1;dy<=1;dy++) for(var dx=-1;dx<=1;dx++){ var d=Math.abs(dx)+Math.abs(dy); cell(gx+dx,gy+dy,color,d===0?0.92:d===1?0.55:0.38); } } }
        function paintSquare(sq,progress){ var cols=Math.max(1,Math.round(progress*6)); for(var x=sq.x;x<sq.x+cols;x++) for(var y=sq.y;y<sq.y+6;y++){ var lit = 0.62 > BAYER[y&3][x&3]; ctx.fillStyle=rgb(sq.c, lit?0.85:0.25); ctx.fillRect(x*CELL,y*CELL,CELL,CELL); } }
        function paintNode(scale){ if(scale<=0.02) return; var half=3*scale, cx=49, cy=32; for(var x=Math.floor(cx-half);x<=Math.ceil(cx+half);x++) for(var y=Math.floor(cy-half);y<=Math.ceil(cy+half);y++){ ctx.fillStyle=rgb(IVORY,0.96); ctx.fillRect(x*CELL,y*CELL,CELL,CELL); } }
        return { paint:function(s){ ctx.clearRect(0,0,SIZE,SIZE); paintStroke(BLUE,tineTop,s.p1); paintStroke(PURPLE,tineMid,s.p2); paintStroke(ORANGE,tineBot,s.p3); paintSquare(squares[0],s.sq0); paintSquare(squares[1],s.sq1); paintSquare(squares[2],s.sq2); paintNode(s.node); bctx.clearRect(0,0,SIZE,SIZE); bctx.drawImage(cv,0,0); } };
      })();
      var state = { p1:0,p2:0,p3:0,sq0:0,sq1:0,sq2:0,node:0 };
      function repaint(){ window.__mark.paint(state); }
      repaint();
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused:true, defaults:{ ease:"power4.out" } });
      tl.fromTo("#markwrap", { scale:0.92, opacity:0 }, { scale:1, opacity:1, duration:0.22, ease:"power3.out" }, 0.0);
      tl.to(state, { p1:1, duration:0.3, ease:"power2.inOut", onUpdate:repaint }, 0.12);
      tl.to(state, { p2:1, duration:0.3, ease:"power2.inOut", onUpdate:repaint }, 0.2);
      tl.to(state, { p3:1, duration:0.3, ease:"power2.inOut", onUpdate:repaint }, 0.28);
      tl.to(state, { sq0:1, duration:0.16, ease:"power4.out", onUpdate:repaint }, 0.5);
      tl.to(state, { sq1:1, duration:0.16, ease:"power4.out", onUpdate:repaint }, 0.56);
      tl.to(state, { sq2:1, duration:0.16, ease:"power4.out", onUpdate:repaint }, 0.62);
      tl.to(state, { node:1, duration:0.16, ease:"power4.out", onUpdate:repaint }, 0.7);
      tl.to(state, { node:1.3, duration:0.1, ease:"power2.inOut", onUpdate:repaint }, 0.86);
      tl.to(state, { node:1, duration:0.08, ease:"power3.out", onUpdate:repaint }, 0.96);
      tl.fromTo("#word", { y:22, opacity:0 }, { y:0, opacity:1, duration:0.22, ease:"power3.out" }, 0.74);
      window.__timelines["10-f10"] = tl;
    </script>
  </body>
</html>
